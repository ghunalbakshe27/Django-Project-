{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F I R E P Y - Reset Password</title>
    <link rel="stylesheet" href="{% static 'backend/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'backend/images/firepy.jpg' %}" type="image/x-icon">
</head>

<body>
    <header>
        <h1>F I R E P Y</h1>
    </header>

    <div class="container">
        <h2>New Password</h2>

        {% if messages %}
        {% for message in messages %}
        <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <div class="password-wrapper">
                    <div class="input-float">
                        <input type="password" id="new_password" name="new_password" placeholder=" " required>
                        <label for="new_password">New Password</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="password-wrapper">
                    <div class="input-float">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder=" " required>
                        <label for="confirm_password">Confirm Password</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <input type="submit" value="Reset Password">
            </div>
        </form>
    </div>

    <footer>&copy; 2026 F I R E P Y. All rights reserved.</footer>
</body>

</html>
