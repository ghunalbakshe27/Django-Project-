{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F I R E P Y - Forgot Password</title>
    <link rel="stylesheet" href="{% static 'backend/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'backend/images/firepy.jpg' %}" type="image/x-icon">
</head>

<body>
    <header>
        <h1>F I R E P Y</h1>
    </header>

    <div class="container">
        <h2>Forgot Password</h2>

        {% if messages %}
        {% for message in messages %}
        <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <div class="input-float">
                    <input type="email" id="email" name="email" placeholder=" " required>
                    <label for="email">Registered Email</label>
                </div>
            </div>
            <div class="form-group">
                <input type="submit" value="Send OTP">
            </div>
        </form>

        <div class="register-link">
            <p>Remember your password? <a href="{% url 'user_login' %}">Login</a></p>
        </div>
    </div>

    <footer>&copy; 2026 F I R E P Y. All rights reserved.</footer>
</body>

</html>
